- name: Bootstrap Kubernetes nodes
  hosts: kubernetes_cluster
  gather_facts: false
  roles:
    - role: preflight
    - role: node_prerequisites
      become: true
    - role: containerd
      become: true
    - role: k8s_packages
      become: true

- name: Configure Kubernetes control plane
  hosts: control_plane
  gather_facts: false
  roles:
    - role: kubeadm_config
      become: true