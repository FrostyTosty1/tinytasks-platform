- name: Work with temporary file
  block:
  - name: Render kubeadm join configuration
    ansible.builtin.template:
      src: join-config.yaml.j2
      dest: /root/kubeadm-join.yaml
      mode: '0600'
    no_log: true
  
  - name: Validate kubeadm join configuration
    ansible.builtin.command: kubeadm config validate --config /root/kubeadm-join.yaml
    changed_when: false
    no_log: true

  - name: Get kubelet config file facts
    ansible.builtin.stat:
      path: /etc/kubernetes/kubelet.conf
    register: kubelet_facts

  - name: Join workers to cluster
    ansible.builtin.command: kubeadm join --config /root/kubeadm-join.yaml
    when: not kubelet_facts.stat.exists
    no_log: true

  always:
  - name: Delete kubeadm join configuration
    ansible.builtin.file:
      path: /root/kubeadm-join.yaml
      state: absent

